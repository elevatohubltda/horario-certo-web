<svg xmlns="http://www.w3.org/2000/svg">

  <!-- Motion lines -->
  <rect x="20" y="50" width="22" height="6" rx="3" fill="#8E988E"/>
  <rect x="20" y="65" width="30" height="6" rx="3" fill="#878B83"/>
  <rect x="20" y="80" width="18" height="6" rx="3" fill="#6D5C43"/>

  <!-- Clock circle -->
  <circle cx="90" cy="70" r="32" stroke="#1E2C28" stroke-width="6" fill="none"/>

  <!-- Clock hands -->
  <line x1="90" y1="70" x2="90" y2="52"
        stroke="#1E2C28" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="70" x2="104" y2="82"
        stroke="#1E2C28" stroke-width="5" stroke-linecap="round"/>

  <!-- Text -->
  <text x="140" y="70"
        font-size="36"
        font-family="Arial, Helvetica, sans-serif"
        fill="#1E2C28"
        font-weight="600">
    Horário
  </text>

  <text x="140" y="108"
        font-size="36"
        font-family="Arial, Helvetica, sans-serif"
        fill="#6D5C43"
        font-weight="600">
    Certo
  </text>
</svg>
