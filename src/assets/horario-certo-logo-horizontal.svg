<svg width="560" height="120" viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg">

  <!-- Motion lines -->
  <rect x="20" y="52" width="22" height="6" rx="3" fill="#8E988E"/>
  <rect x="20" y="67" width="30" height="6" rx="3" fill="#878B83"/>
  <rect x="20" y="82" width="18" height="6" rx="3" fill="#6D5C43"/>

  <!-- Clock -->
  <circle cx="90" cy="60" r="30" stroke="#1E2C28" stroke-width="6" fill="none"/>

  <!-- Clock hands -->
  <line x1="90" y1="60" x2="90" y2="44"
        stroke="#1E2C28" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="60" x2="104" y2="72"
        stroke="#1E2C28" stroke-width="5" stroke-linecap="round"/>

  <!-- Text group aligned vertically -->
  <g transform="translate(140,60)">
    <text x="0" y="12"
          font-size="38"
          font-family="Arial, Helvetica, sans-serif"
          fill="#1E2C28"
          font-weight="600">
      Horário
    </text>

    <text x="140" y="12"
          font-size="38"
          font-family="Arial, Helvetica, sans-serif"
          fill="#6D5C43"
          font-weight="600">
      Certo
    </text>
  </g>
</svg>
